# Render Blueprint — deploys Channel D Connect as an HTTPS web service.
# In Render: New + → Blueprint → point it at this repo, and it reads this file.
services:
  - type: web
    name: channel-d-connect
    runtime: node
    plan: free            # bump to "starter" ($7/mo) to avoid cold starts
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Anthropic API key for the AI diagnosis assistant. Set in the Render
      # dashboard (kept out of the repo). Without it, screen capture still works
      # but diagnosis returns a "not configured" message.
      - key: ANTHROPIC_API_KEY
        sync: false
      # TextBelt key for texting the join link (pay-as-you-go). Set in the
      # dashboard. If unset, the app falls back to 1 free test SMS per day.
      - key: TEXTBELT_API_KEY
        sync: false
      # TURN relay — needed so calls connect on cellular / restrictive networks.
      # Preferred: Cloudflare TURN (1,000 GB/mo free). Create a TURN key in the
      # Cloudflare dashboard (Realtime) → set the key ID + API token here.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Alternative: static TURN credentials from any provider (used only if the
      # Cloudflare vars above are unset). All unset = STUN only.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
