<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Channel D Connect — Case History</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --panel-2: #1c2230; --border: #2a3140;
      --text: #e6edf3; --muted: #8b98a9; --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 10px; padding: 14px 22px;
      border-bottom: 1px solid var(--border); background: var(--panel); font-weight: 600;
    }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    header a { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; }
    main { flex: 1; display: flex; min-height: 0; }
    @media (max-width: 800px) { main { flex-direction: column; } }

    .list { width: 340px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; }
    @media (max-width: 800px) { .list { width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); } }
    .list-item { padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .list-item:hover { background: var(--panel); }
    .list-item.active { background: var(--panel-2); }
    .list-item .date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .list-item .desc { font-size: 14px; margin-bottom: 4px; }
    .list-item .count { font-size: 12px; color: var(--muted); }
    .list-empty, .thread-empty { color: var(--muted); padding: 40px 24px; text-align: center; }

    .thread { flex: 1; overflow-y: auto; padding: 24px; }
    .thread h2 { font-size: 16px; margin-bottom: 4px; }
    .thread .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
    .entry { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; background: var(--panel); max-width: 560px; }
    .entry img { width: 100%; border-radius: 8px; display: block; margin-bottom: 10px; background: #000; }
    .entry .note { font-size: 12px; color: var(--muted); font-style: italic; margin-bottom: 8px; }
    .entry .reply { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .entry .time { font-size: 11px; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <span class="dot"></span> Channel D Connect — Case History
    <a href="/host">← Back to host</a>
  </header>
  <main>
    <div class="list" id="list"><div class="list-empty">Loading…</div></div>
    <div class="thread" id="thread"><div class="thread-empty">Select a case to view its thread.</div></div>
  </main>

  <script>
  (function () {
    'use strict';
    const listEl = document.getElementById('list');
    const threadEl = document.getElementById('thread');

    function fmt(ts) {
      try { return new Date(ts).toLocaleString(); } catch (_) { return ''; }
    }

    async function loadList() {
      try {
        const r = await fetch('/api/history');
        const { sessions } = await r.json();
        if (!sessions.length) {
          listEl.innerHTML = '<div class="list-empty">No cases yet.</div>';
          return;
        }
        listEl.innerHTML = '';
        sessions.forEach((s) => {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML =
            '<div class="date">' + fmt(s.createdAt) + '</div>' +
            '<div class="desc">' + (escapeHtml(s.caseDescription) || '<em>(no description)</em>') + '</div>' +
            '<div class="count">' + s.messageCount + ' capture' + (s.messageCount === 1 ? '' : 's') + ' · room ' + escapeHtml(s.roomId) + '</div>';
          item.addEventListener('click', () => {
            document.querySelectorAll('.list-item').forEach((el) => el.classList.remove('active'));
            item.classList.add('active');
            loadThread(s.id);
          });
          listEl.appendChild(item);
        });
      } catch (e) {
        listEl.innerHTML = '<div class="list-empty">Failed to load: ' + escapeHtml(e.message) + '</div>';
      }
    }

    async function loadThread(id) {
      threadEl.innerHTML = '<div class="thread-empty">Loading…</div>';
      try {
        const r = await fetch('/api/history/' + id);
        const { session, messages } = await r.json();
        let html =
          '<h2>' + (escapeHtml(session.caseDescription) || '(no description)') + '</h2>' +
          '<div class="sub">' + fmt(session.createdAt) + ' · room ' + escapeHtml(session.roomId) + '</div>';
        if (!messages.length) {
          html += '<div class="thread-empty">No captures in this case.</div>';
        } else {
          messages.forEach((m) => {
            html += '<div class="entry">';
            if (m.imageUrl) html += '<img src="' + m.imageUrl + '" alt="capture" />';
            if (m.note) html += '<div class="note">' + escapeHtml(m.note) + '</div>';
            html += '<div class="reply">' + (escapeHtml(m.aiReply) || '<em>(no reply)</em>') + '</div>';
            html += '<div class="time">' + fmt(m.timestamp) + '</div>';
            html += '</div>';
          });
        }
        threadEl.innerHTML = html;
      } catch (e) {
        threadEl.innerHTML = '<div class="thread-empty">Failed to load: ' + escapeHtml(e.message) + '</div>';
      }
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    loadList();
  })();
  </script>
</body>
</html>
